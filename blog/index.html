---
layout: default
title: Blog
---
<h1>Posts</h1>
<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
    <div class="post-meta">{{ post.date | date: "%B %-d, %Y" }}</div>
    <p class="excerpt">{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
  </li>
  {% endfor %}
</ul>
