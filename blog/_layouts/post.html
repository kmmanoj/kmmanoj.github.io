---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%B %-d, %Y" }}
    </time>
    {% if page.tags.size > 0 %}
    <div class="post-tags">
      {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
    </div>
    {% endif %}
  </header>

  <div class="post-layout">
    <aside class="post-toc" id="toc">
      <p class="toc-title">Contents</p>
      <nav id="toc-nav"></nav>
    </aside>

    <div class="post-body" id="post-body">
      {{ content }}
    </div>
  </div>
</article>

<script>
(function () {
  var headings = document.querySelectorAll('#post-body h2, #post-body h3, #post-body h4');
  if (headings.length === 0) {
    document.getElementById('toc').style.display = 'none';
    return;
  }

  var nav = document.getElementById('toc-nav');
  var ul = document.createElement('ul');
  ul.className = 'toc-list';

  headings.forEach(function (h, i) {
    if (!h.id) h.id = 'heading-' + i;

    var li = document.createElement('li');
    li.className = 'toc-item toc-' + h.tagName.toLowerCase();

    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    a.className = 'toc-link';

    li.appendChild(a);
    ul.appendChild(li);
  });

  nav.appendChild(ul);

  // Move leading blockquote to header as subtitle
  var body = document.getElementById('post-body');
  var first = body.firstElementChild;
  if (first && first.tagName === 'BLOCKQUOTE') {
    var subtitle = document.createElement('p');
    subtitle.className = 'post-subtitle';
    subtitle.textContent = first.textContent.trim();
    document.querySelector('.post-header').appendChild(subtitle);
    first.remove();
  }

  // Highlight active heading on scroll
  var links = nav.querySelectorAll('.toc-link');
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        links.forEach(function (l) { l.classList.remove('active'); });
        var active = nav.querySelector('a[href="#' + entry.target.id + '"]');
        if (active) active.classList.add('active');
      }
    });
  }, { rootMargin: '0px 0px -80% 0px' });

  headings.forEach(function (h) { observer.observe(h); });
}());
</script>
